<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#0A0A0A;color:#E5E5E5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  header{padding:48px 24px 24px;text-align:center;max-width:1200px;margin:0 auto}
  header h1{font-size:34px;margin:0 0 8px;letter-spacing:-0.5px;font-weight:700;color:#fff}
  header p{margin:0;color:#9CA3AF;font-size:15px;max-width:640px;margin:0 auto}
  header .brand{display:inline-block;font-size:12px;font-weight:600;letter-spacing:2px;color:#10b981;margin-bottom:12px;text-transform:uppercase}

  .stats{
    max-width:1200px;margin:24px auto 0;padding:0 24px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  }
  .stat{
    background:#111;border:1px solid #1f1f1f;border-radius:12px;padding:16px;text-align:center;
  }
  .stat .v{font-size:24px;font-weight:700;color:#fff}
  .stat .l{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-top:4px}

  .controls{
    max-width:1200px;margin:24px auto 0;padding:0 24px;
    display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:12px;align-items:center;
  }
  .controls select,.controls input{
    background:#111;border:1px solid #1f1f1f;color:#e5e5e5;border-radius:10px;
    padding:10px 12px;font-size:14px;font-family:inherit;width:100%;
  }
  .controls select:focus,.controls input:focus{outline:none;border-color:#10b981}
  .toggle{
    display:flex;align-items:center;gap:8px;background:#111;border:1px solid #1f1f1f;
    border-radius:10px;padding:10px 14px;font-size:13px;color:#9CA3AF;cursor:pointer;white-space:nowrap;
  }
  .toggle input{accent-color:#10b981;cursor:pointer}

  main{max-width:1200px;margin:24px auto 64px;padding:0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

  .card{
    background:#111;border:1px solid #1f1f1f;border-radius:14px;padding:20px;
    cursor:pointer;transition:border-color .18s ease,transform .18s ease,background .18s ease;
    position:relative;display:flex;flex-direction:column;gap:8px;
  }
  .card::after{
    content:"Click to view details";
    position:absolute;left:20px;right:20px;bottom:14px;font-size:11px;color:#10b981;
    opacity:0;transition:opacity .18s ease;letter-spacing:0.5px;text-transform:uppercase;
  }
  .card:hover{border-color:#10b981;transform:translateY(-2px);background:#141414}
  .card:hover::after{opacity:1}
  .card.claimed{opacity:.6;cursor:default}
  .card.claimed:hover{border-color:#1f1f1f;transform:none;background:#111}
  .card.claimed::after{content:""}

  .card .title{font-size:16px;font-weight:700;color:#fff;margin:0;padding-right:64px}
  .card .states{font-size:12px;color:#9CA3AF;margin-top:2px}
  .card .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-bottom:18px}
  .card .price{font-size:20px;font-weight:700;color:#fff}
  .card .price small{font-size:12px;color:#6b7280;font-weight:500}
  .card .counties{font-size:12px;color:#6b7280}

  .badge{
    position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;padding:4px 8px;border-radius:6px;color:#fff;
  }
  .badge.premium{background:#10b981}
  .badge.standard{background:#3b82f6}
  .badge.starter{background:#6b7280}
  .badge.claimed{background:#ef4444}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;z-index:50;
  }
  .modal-bg.open{display:flex}
  .modal{
    background:#111;border:1px solid #1f1f1f;border-radius:16px;max-width:640px;width:100%;
    padding:32px;position:relative;margin:auto;
  }
  .modal .close{
    position:absolute;top:14px;right:14px;background:transparent;border:none;color:#6b7280;
    font-size:22px;cursor:pointer;width:32px;height:32px;border-radius:8px;
  }
  .modal .close:hover{background:#1f1f1f;color:#fff}
  .modal h2{margin:0 0 4px;color:#fff;font-size:22px;padding-right:32px}
  .modal .modal-states{color:#9CA3AF;font-size:13px;margin-bottom:16px}
  .modal .modal-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .modal .pill{
    background:#1f1f1f;border-radius:8px;padding:6px 12px;font-size:12px;color:#d1d5db;
  }
  .modal .modal-counties{
    background:#0a0a0a;border:1px solid #1f1f1f;border-radius:10px;
    padding:14px 16px;font-size:13px;color:#d1d5db;line-height:1.7;margin-bottom:20px;
    max-height:240px;overflow-y:auto;
  }
  .modal .modal-counties strong{color:#10b981;font-weight:600}
  .modal .price-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .modal .price-row .big{font-size:30px;font-weight:700;color:#fff}
  .modal .price-row .big small{font-size:14px;color:#6b7280;font-weight:500}
  .modal .claim{
    display:block;width:100%;text-align:center;padding:14px 24px;border-radius:10px;
    background:#10b981;color:#fff;font-weight:700;font-size:14px;letter-spacing:0.3px;
    border:none;cursor:pointer;text-decoration:none;
  }
  .modal .claim:hover{background:#0d9468}
  .modal .claim.disabled{background:#374151;color:#9CA3AF;cursor:not-allowed;pointer-events:none}

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .controls{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
    .modal-bg{padding:0;align-items:stretch}
    .modal{border-radius:0;border:none;min-height:100vh;max-width:none;margin:0}
  }
</style>
</head>

    stateSel.appendChild(o);
  });

  // Build cards once
  var grid = document.getElementById('grid');
  var cards = DATA.map(function(m,i){
    var card = document.createElement('div');
    card.className = 'card' + (m.status==='claimed' ? ' claimed' : '');
    card.dataset.idx = i;

    var badgeText = m.status==='claimed' ? 'Claimed' : (m.volume_tier.replace(' MSA',''));
    var badgeCls = m.status==='claimed' ? 'claimed' : tierClass(m.volume_tier);

    card.innerHTML =
      '<span class="badge '+badgeCls+'">'+badgeText+'</span>'+
      '<h3 class="title">'+esc(m.msa_title)+'</h3>'+
      '<div class="states">'+esc(m.states)+'</div>'+
      '<div class="meta">'+
        '<div class="counties">'+m.county_count+' '+(m.county_count===1?'county':'counties')+'</div>'+
        '<div class="price">'+fmtPrice(m.monthly_price)+'<small>/mo</small></div>'+
      '</div>';

    if(m.status!=='claimed'){
      card.addEventListener('click', function(){ openModal(m); });
    }
    return card;
  });

  function esc(s){return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // Filtering
  var stateF = document.getElementById('state-filter');
  var tierF = document.getElementById('tier-filter');
  var searchF = document.getElementById('search');
  var showClaimedF = document.getElementById('show-claimed');

  function render(){
    var s = stateF.value;
    var t = tierF.value;
    var q = searchF.value.trim().toLowerCase();
    var sc = showClaimedF.checked;
    grid.innerHTML = '';
    var shown = 0;
    DATA.forEach(function(m,i){
      var stateList = m.states.split(',').map(function(x){return x.trim();});
      if(s && stateList.indexOf(s)===-1) return;
      if(t && m.volume_tier!==t) return;
      if(q && m.msa_title.toLowerCase().indexOf(q)===-1) return;
      if(!sc && m.status==='claimed') return;
      grid.appendChild(cards[i]);
      shown++;
    });
    document.getElementById('stat-shown').textContent = shown;
  }

  // Stats
  var available = DATA.filter(function(m){return m.status!=='claimed';}).length;
  var claimed = DATA.length - available;
  document.getElementById('stat-available').textContent = available;
  document.getElementById('stat-claimed').textContent = claimed;
  document.getElementById('stat-states').textContent = allStates.length;

  [stateF,tierF,showClaimedF].forEach(function(el){el.addEventListener('change',render);});
  searchF.addEventListener('input', render);
  render();

  // Modal
  var modalBg = document.getElementById('modal-bg');
  var mTitle = document.getElementById('m-title');
  var mStates = document.getElementById('m-states');
  var mMeta = document.getElementById('m-meta');
  var mCounties = document.getElementById('m-counties');
  var mPrice = document.getElementById('m-price');
  var mStatus = document.getElementById('m-status');
  var mClaim = document.getElementById('m-claim');

  function openModal(m){
    mTitle.textContent = m.msa_title;
    mStates.textContent = m.states;
    var badgeCls = tierClass(m.volume_tier);
    mMeta.innerHTML =
      '<span class="pill"><span class="badge '+badgeCls+'" style="position:static;display:inline-block;margin-right:6px;">'+m.volume_tier.replace(' MSA','')+'</span>'+m.volume_tier+'</span>'+
      '<span class="pill">'+m.county_count+' '+(m.county_count===1?'county':'counties')+'</span>';

    var counties = m.counties.map(function(c){return c.county_name+', '+c.state;});
    mCounties.innerHTML = '<strong>Includes:</strong> ' + counties.map(esc).join('; ');

    mPrice.innerHTML = fmtPrice(m.monthly_price)+'<small>/mo</small>';
    mStatus.textContent = m.status==='claimed' ? 'Claimed' : 'Available';

    if(m.status==='claimed'){
      mClaim.classList.add('disabled');
      mClaim.textContent = 'Claimed';
      mClaim.removeAttribute('href');
    } else {
      mClaim.classList.remove('disabled');
      mClaim.textContent = 'Claim This MSA';
      var subj = encodeURIComponent('Claim '+m.msa_title);
      var body = encodeURIComponent("I'd like to claim the "+m.msa_title+' MSA at '+fmtPrice(m.monthly_price)+'/mo. Please send me the next steps.');
      mClaim.href = 'mailto:hello@auctionleads.io?subject='+subj+'&body='+body;
    }

    modalBg.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    modalBg.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modalBg.addEventListener('click', function(e){if(e.target===modalBg)closeModal();});
  document.addEventListener('keydown', function(e){if(e.key==='Escape')closeModal();});
})();
</script>
</body>
</html>
